services:
  mysql:
    image: mysql:8.4
    container_name: sunrise-dental-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: sunrise_dental
      MYSQL_USER: sunrise_user
      MYSQL_PASSWORD: sunrise_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3306:3306"
    volumes:
      - sunrise_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_password"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    container_name: sunrise-dental-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/sunrise_dental?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Colombo
      DB_USERNAME: sunrise_user
      DB_PASSWORD: sunrise_password
    ports:
      - "8080:8080"

volumes:
  sunrise_mysql_data:
